<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>พอร์ตโฟลิโอ คณะบริหารธุรกิจ / บัญชี | Portfolio Guide Pro</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #3b82f6; /* สีน้ำเงิน สำหรับคณะบริหารธุรกิจ / บัญชี */
      --accent-hover: #2563eb;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar {
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
    }
    .hero-section {
      padding: 2.5rem 1rem;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
    }
    .portfolio-card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      transition: all 0.3s ease;
      overflow: hidden;
      height: 100%;
    }
    .portfolio-card-link {
      text-decoration: none;
      display: block;
      height: 100%;
    }
    .portfolio-card-link:hover .portfolio-card {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }
    .portfolio-cover {
      width: 100%;
      aspect-ratio: 1 / 1.414; 
      object-fit: cover;
      object-position: top;
      border-bottom: 1px solid #334155;
      background-color: #0b0f19;
    }
    .text-accent { color: var(--accent); }
    .lang-btn {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid #334155;
      padding: 0.375rem 0.75rem;
      border-radius: 8px;
    }
    .lang-btn:hover, .lang-btn:focus {
      border-color: var(--accent);
      color: var(--accent);
    }
    .dropdown-menu-dark {
      background-color: var(--card-bg);
      border-color: #334155;
    }
    .btn-back {
      background-color: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
      transition: all 0.3s ease;
    }
    .btn-back:hover {
      background-color: #334155;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-layers-fill text-accent"></i> PortGuide<span class="text-accent">Pro</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center pt-2 pt-lg-0">
          <li class="nav-item"><a class="nav-link py-2" href="index.html" data-i18n="nav_home">หน้าหลัก</a></li>
          <li class="nav-item me-lg-3 mb-2 mb-lg-0"><a class="nav-link py-2" href="compare.html" data-i18n="nav_compare">เปรียบเทียบมหาวิทยาลัย</a></li>
          
          <li class="nav-item dropdown">
            <button class="btn lang-btn dropdown-toggle w-100 text-start text-lg-center" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-globe"></i> <span id="currentLangLabel">TH</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow" aria-labelledby="langDropdown">
              <li><a class="dropdown-item py-2" href="#" onclick="changeLanguage('th')">🇹🇭 ไทย (TH)</a></li>
              <li><a class="dropdown-item py-2" href="#" onclick="changeLanguage('en')">🇬🇧 English (EN)</a></li>
              <li><a class="dropdown-item py-2" href="#" onclick="changeLanguage('zh')">🇨🇳 中文 (ZH)</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero-section text-center">
    <div class="container">
      <div class="display-1 text-accent mb-2"><i class="bi bi-briefcase"></i></div>
      <h1 class="h3 h1-md fw-bold mb-2" data-i18n="page_title">คลังพอร์ตโฟลิโอ <span class="text-accent">คณะบริหารธุรกิจ / บัญชี</span></h1>
      <p class="small text-secondary mb-0" data-i18n="page_subtitle">บริหารธุรกิจ, บัญชี, การตลาด, โลจิสติกส์, เศรษฐศาสตร์ ฯลฯ</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container-fluid py-4 px-3 px-md-4 px-lg-5">
    <div class="mb-4 d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2">
      <a href="portfolio-examples.html" class="btn btn-back rounded-pill px-4 py-2 fw-bold">
        <i class="bi bi-arrow-left me-2"></i> <span data-i18n="btn_back">กลับหน้าหมวดหมู่</span>
      </a>
      <span class="text-secondary small"><i class="bi bi-info-circle me-1"></i> <span data-i18n="hint_click">คลิกที่การ์ดเพื่ออ่านพอร์ต</span></span>
    </div>

    <div class="row g-3 g-md-4">
      <!-- การ์ดตัวอย่างพอร์ต (เปิดใช้งานเมื่อพร้อมนำรูปมาใส่) -->

      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <a href="view-portfolio.html" class="portfolio-card-link">
          <div class="portfolio-card">
            <img src="พอร์ตบริหาร/page1.jpg" alt="Cover Business" class="portfolio-cover" onerror="this.src='https://via.placeholder.com/400x566/1e293b/3b82f6?text=Business+Cover'">
            <div class="p-3">
              <span class="badge mb-2" style="background-color: var(--accent);" data-i18n="tag_bus">บริหารธุรกิจ / บัญชี</span>
              <h6 class="fw-bold mb-1 text-white fs-6">พอร์ตโฟลิโอ สาขาบริหารธุรกิจ</h6>
              <p class="text-secondary small mb-0"><i class="bi bi-person me-1"></i> รุ่นพี่สายบริหาร</p>
            </div>
          </div>
        </a>
      </div>
      -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const translations = {
      th: {
        nav_home: "หน้าหลัก",
        nav_compare: "เปรียบเทียบมหาวิทยาลัย",
        page_title: 'คลังพอร์ตโฟลิโอ <span class="text-accent">คณะบริหารธุรกิจ / บัญชี</span>',
        page_subtitle: "บริหารธุรกิจ, บัญชี, การตลาด, โลจิสติกส์, เศรษฐศาสตร์ ฯลฯ",
        btn_back: "กลับหน้าหมวดหมู่",
        hint_click: "คลิกที่การ์ดเพื่ออ่านพอร์ต",
        tag_bus: "บริหารธุรกิจ / บัญชี"
      },
      en: {
        nav_home: "Home",
        nav_compare: "Compare Universities",
        page_title: '<span class="text-accent">Business / Accounting</span> Portfolio',
        page_subtitle: "Business Admin, Accounting, Marketing, Logistics, Economics, etc.",
        btn_back: "Back to Categories",
        hint_click: "Click a card to read portfolio",
        tag_bus: "Business / Accounting"
      },
      zh: {
        nav_home: "首页",
        nav_compare: "大学对比",
        page_title: '<span class="text-accent">商学 / 会计</span> 作品集库',
        page_subtitle: "工商管理、会计、营销、物流、经济学等",
        btn_back: "返回类别",
        hint_click: "点击卡片阅读作品集",
        tag_bus: "商学 / 会计"
      }
    };
    function changeLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          element.innerHTML = translations[lang][key];
        }
      });
      document.getElementById('currentLangLabel').innerText = lang.toUpperCase();
      localStorage.setItem('preferredLanguage', lang);
    }
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('preferredLanguage') || 'th';
      changeLanguage(savedLang);
    });
  </script>
</body>
</html>
